<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
</head><body>
<script type="module">
// Generic deterministic scene host. ?scene=<name>&dur=<seconds>
// Each scene module exports build({ dur }) -> { renderer, render(t) }.
const q = new URLSearchParams(location.search);
const dur = Number(q.get('dur') || 5);
const mod = await import(`./scenes/${q.get('scene')}.js`);
const s = await mod.build({ dur });
window.FRAMES = Math.round(dur * 24);
window.renderFrame = (i) => { s.render(i / 24); return s.renderer.domElement.toDataURL('image/png'); };
window.READY = true;
</script>
</body></html>
